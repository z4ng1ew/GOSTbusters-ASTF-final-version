  /payment-consents/request:
    post:
      tags:
        - 3 Согласия на переводы
      summary: 1. Создать запрос согласия на перевод
      description: |-
        ## 💳 Создание запроса на согласие для платежа

        **OpenBanking Russia Payment Consents API**

        ### Поддерживаемые типы:

        #### 1. Single Use (одноразовый)

        **С указанием получателя (платеж только на этот счет):**
        ```json
        {
          "requesting_bank": "team200",
          "client_id": "team200-1",
          "consent_type": "single_use",
          "amount": 5000.00,
          "debtor_account": "40817810...",
          "creditor_account": "40817820...",
          "creditor_name": "Иван Иванов",
          "reference": "Оплата услуг"
        }
        ```

        **БЕЗ указания получателя (платеж любому, но только один раз):**
        ```json
        {
          "requesting_bank": "team200",
          "client_id": "team200-1",
          "consent_type": "single_use",
          "amount": 5000.00,
          "debtor_account": "40817810...",
          "reference": "Оплата услуг"
        }
        ```

        #### 2. Multi Use (многоразовый)

        **С ограничением по получателям:**
        ```json
        {
          "requesting_bank": "team200",
          "client_id": "team200-1",
          "consent_type": "multi_use",
          "debtor_account": "40817810...",
          "max_uses": 10,
          "max_amount_per_payment": 5000.00,
          "max_total_amount": 50000.00,
          "allowed_creditor_accounts": ["40817820...", "40817830..."],
          "valid_until": "2025-12-31T23:59:59"
        }
        ```

