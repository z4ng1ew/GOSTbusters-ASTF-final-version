        ## 🧩 Каталог банковских продуктов


        ### Получение списка всех доступных продуктов банка


        #### Типы продуктов:

        - `deposit` — вклады/депозиты

        - `loan` — кредиты (потребительские, ипотека, авто)

        - `card` — банковские карты (дебетовые, кредитные)

        - `account` — расчетные счета


        #### Фильтрация:

        ```bash

        GET /products?product_type=deposit

        ```


        ### Ответ содержит:

        - `productId` — уникальный ID продукта

        - `productType` — тип продукта

        - `productName` — название

        - `description` — описание

        - `interestRate` — процентная ставка (для депозитов/кредитов)

        - `minAmount` / `maxAmount` — лимиты по сумме

        - `termMonths` — срок (в месяцах)


        ### 🚀 Продуктовая воронка:


        1. **Каталог** → `GET /products` (этот endpoint)

        2. **Лид** → `POST /customer-leads` (оставить заявку на консультацию)

        3. **Предложение** → `GET /product-offers` (получить персональное
        предложение)

        4. **Заявка** → `POST /product-application` (подать заявку на продукт)

        5. **Договор** → `POST /product-agreements` (открыть продукт)


        ### Примеры продуктов в sandbox:

        - **Вклад "Надежный"**: 8.5% годовых, от 10,000₽

        - **Потребительский кредит**: 12.9% годовых, до 3,000,000₽

        - **Дебетовая карта "Свобода"**: с кэшбэком 2%


        ### ⚠️ Обратите внимание:

        - Каталог доступен без авторизации (публичная информация)

        - Для подачи заявки требуется авторизация клиента

        - Условия могут отличаться для разных банков
