  /account-consents/request:
    post:
      tags:
        - 1 Согласия на доступ к счетам
      summary: 1. Создать согласие
      description: >-
        Создание согласия на доступ к счетам клиента


        Согласия нужны для доступа к данным клиентов из других банков.

        После создания согласия вы сможете запрашивать счета, балансы и
        транзакции.


        ### Пример использования:


        ```bash

        # 1. Получить токен банка, где лежат данные клиента

        POST https://vbank.open.bankingapi.ru/auth/bank-token

        ?client_id=team200&client_secret=YOUR_SECRET

        → {"access_token": "eyJhbG..."}


        # 2. Запросить согласие (авто-одобрение)

        POST https://vbank.open.bankingapi.ru/account-consents/request

        Headers:
          Authorization: Bearer eyJhbG...
          X-Requesting-Bank: team200
        Body:

        {
          "client_id": "team200-1",
          "permissions": ["ReadAccountsDetail", "ReadBalances"],
          "reason": "Агрегация счетов для HackAPI",
          "requesting_bank": "team200",
          "requesting_bank_name": "Team 200 App"
        }


        → {"status": "approved", "consent_id": "consent-abc123",
        "auto_approved": true}


        # 3. Запросить данные

        GET https://vbank.open.bankingapi.ru/accounts?client_id=team200-1

        Headers:
          Authorization: Bearer eyJhbG...
          X-Requesting-Bank: team200
          X-Consent-Id: consent-abc123

        → 200 OK {"accounts": [...]}

        ```


        ### ⚠️ Частые ошибки:


        1. **X-Requesting-Bank: team200-1** ❌ НЕПРАВИЛЬНО!  
           Должно быть **team200** (ID команды, без суффикса клиента)

        2. **Забыли X-Consent-Id** → получите 403 CONSENT_REQUIRED


        3. **Используете client_token вместо bank_token** → 401 Unauthorized


        ### Что происходит внутри:

        1. Создаётся запрос согласия для клиента

        2. Если банк настроен на авто-одобрение (VBank, ABank):
           - Согласие одобряется автоматически
           - Можно сразу запрашивать данные
        3. Если банк требует ручное одобрение (SBank):
           - Клиент увидит запрос в своём UI
           - Должен подтвердить через кнопку "Подписать"
           - После этого ваше приложение может запрашивать данные
      operationId: request_consent_account_consents_request_post
      parameters:
        - name: x-requesting-bank
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: ID вашей команды (от организаторов). Укажите для создания согласия
            title: X-Requesting-Bank
