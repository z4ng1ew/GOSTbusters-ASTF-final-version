openapi: 3.1.0
info:
  title: Virtual Bank API
  version: "2.1"
paths:
  /auth/bank-token:
    post:
      tags:
        - 0 Аутентификация вызывающей системы
        - 0 Аутентификация вызывающей системы
      summary: Create Bank Token
      description: |-
        ## 🎯 Получение токена для работы с API банка

        **Этот endpoint - точка входа для всех участников хакатона!**

        Токен выдается банком, У КОТОРОГО вы запрашиваете данные.
        Каждый банк подписывает токен своим приватным ключом (RS256).

        ### Где взять credentials?

        Получите у организаторов хакатона:
        - `client_id` — код вашей команды (например: team200)
        - `client_secret` — ваш секретный ключ (API key)

        ### Пример запроса:

        ```bash
        # Получить токен для запросов к VBank
        POST https://vbank.open.bankingapi.ru/auth/bank-token
        ?client_id=team200
        &client_secret=5OAaa4DYzYKfnOU6zbR34ic5qMm7VSMB

        # Ответ:
        {
          "access_token": "eyJ...",
          "token_type": "bearer",
          "client_id": "team200",
          "expires_in": 86400
        }
        ```

        ### Использование токена:

        ```bash
        GET https://vbank.open.bankingapi.ru/accounts
        Headers:
          Authorization: Bearer eyJ...
        ```

        ### Важно:

        - Токен валиден 24 часа
        - Для каждого банка нужен свой токен (VBank, ABank, SBank)
        - Токен подписан приватным ключом банка (RS256)
        - Публичный ключ: `/.well-known/jwks.json`

        ### Межбанковые запросы:

        Для получения данных клиента из другого банка добавьте:
        ```
        X-Requesting-Bank: your_client_id
        ```
        И создайте согласие: `POST /account-consents`
      operationId: create_bank_token_auth_bank_token_post
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            description: ID команды от организаторов
            title: Client Id
          description: ID команды от организаторов
          example: team200
        - name: client_secret
          in: query
          required: true
          schema:
            type: string
            description: Secret команды от организаторов
            title: Client Secret
          description: Secret команды от организаторов
          example: 5OAaa4DYzYKfnOU6zbR34ic5qMm7VSMB
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /accounts:
    get:
      tags:
        - 2 Счета и балансы
      summary: 1. Получить список счетов
      description: >-
        ## 💳 Получение списка счетов клиента


        ### Два режима работы:


        #### 1️⃣ Запрос своих счетов (в том же банке)

        ```bash

        GET /accounts

        Headers:
          Authorization: Bearer <client_token>
        ```


        #### 2️⃣ Межбанковый запрос (с согласием)

        ```bash

        GET /accounts?client_id=cli-ab-001

        Headers:
          Authorization: Bearer <bank_token>
          X-Requesting-Bank: team200
          X-Consent-Id: <consent_id>
        ```


        ### Ответ содержит:

        - `account_id` — уникальный идентификатор счета

        - `currency` — валюта (RUB, USD, EUR)

        - `account_type` — тип счета (Personal, Business)

        - `nickname` — название счета

        - `servicer` — информация о банке


        ### ⚠️ Важно для межбанковых запросов:

        1. Сначала создайте согласие: `POST /account-consents/request`

        2. Клиент должен одобрить согласие в банке-владельце счетов

        3. Используйте полученный `consent_id` в заголовке `X-Consent-Id`

        4. Укажите свой банк в `X-Requesting-Bank`


        ### Примечание:

        - Без согласия межбанковый запрос вернет 403 с подсказкой, как получить
        согласие

        - Согласие имеет срок действия (обычно 90 дней)
      operationId: get_accounts_accounts_get
      security:
        - HTTPBearer: []
      parameters:
        - name: client_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: ID клиента (например team200-1). Обязателен для межбанковых
              запросов
            title: Client Id
          description: ID клиента (например team200-1). Обязателен для межбанковых запросов
          example: team200-1
        - name: x-consent-id
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: ID согласия (получите через POST /account-consents/request).
              Обязателен для межбанковых запросов
            title: X-Consent-Id
          description: ID согласия (получите через POST /account-consents/request).
            Обязателен для межбанковых запросов
          example: consent-69e75facabba
        - name: x-requesting-bank
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: ID вашей команды (от организаторов). Укажите для запроса данных из
              другого банка
            title: X-Requesting-Bank
          description: ID вашей команды (от организаторов). Укажите для запроса данных из
            другого банка
          example: team200
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    post:
      tags:
        - 2 Счета и балансы
      summary: 5. Создать счет
      description: |-
        Создание нового счета

        Поддерживаемые типы: checking, savings
      operationId: create_account_accounts_post
